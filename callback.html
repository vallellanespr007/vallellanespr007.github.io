<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla Callback</title>
<style>body{font-family:system-ui;max-width:560px;margin:40px auto;padding:0 16px;background:#111;color:#eee}code{display:block;word-break:break-all;background:#222;padding:14px;border-radius:8px;font-size:15px}button{margin-top:12px;padding:10px 16px;border:0;border-radius:8px;background:#3a7bd5;color:#fff;font-size:15px}</style>
<h2>Autorización de Tesla</h2><p id="m">Copia este código y pégalo en la terminal:</p><code id="c"></code><button onclick="navigator.clipboard.writeText(document.getElementById('c').textContent);this.textContent='Copiado ✓'">Copiar código</button>
<script>const q=new URLSearchParams(location.search),c=q.get('code');if(c){document.getElementById('c').textContent=c}else{document.getElementById('m').textContent='No llegó código. Error: '+(q.get('error_description')||q.get('error')||'desconocido');document.getElementById('c').remove();document.querySelector('button').remove()}</script></html>
